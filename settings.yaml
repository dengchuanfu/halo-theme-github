apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-theme-github-setting
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: name
          label: 站点信息设置 - 名称
          value: "Monster"
          help: 显示在大 Logo 下方的加粗名称
        - $formkit: textarea
          name: description
          label: 站点信息设置 - 描述
          value: "我是真滴帅～"
          help: 显示在加粗名称下方的灰色文字
        - $formkit: array
          name: profile_meta
          label: 个人资料信息
          value:
            - text: "社会大学"
              icon: "octicon:organization-16"
              url: ""
            - text: "ShenZhen"
              icon: "octicon:location-16"
              url: ""
            - text: "monster@ffbf.top"
              icon: "octicon:mail-16"
              url: "mailto:monster@ffbf.top"
          addLabel: 添加资料信息
          emptyText: 暂无资料信息
          help: 可自定义内容、Iconify 图标和链接，并拖动调整显示顺序
          itemLabels:
            - type: text
              label: "$value.text"
          children:
            - $formkit: text
              name: text
              label: 内容
              value: ""
              placeholder: "社会大学"
            - $formkit: text
              name: icon
              label: Iconify 图标
              value: "octicon:info-16"
              placeholder: "octicon:organization-16"
            - $formkit: text
              name: url
              label: 链接（可选）
              value: ""
              placeholder: "mailto:monster@ffbf.top"
        - $formkit: checkbox
          name: show_stats
          label: 是否显示网站统计信息
          value: true
          help: 开启后在前端大 Logo 资料区显示总文章数量、总评论数量和总访问量
        - $formkit: number
          name: activity_limit
          label: 首页站点动态显示条数
          value: 6
          min: 1
          max: 50
          help: 首页“站点动态”默认展示的最新记录数量
        - $formkit: select
          name: status
          label: 状态 Emoji
          value: "😊"
          help: 显示在前端大 Logo 右下角的小圆圈中
          options:
            - label: "😊 开心"
              value: "😊"
            - label: "🤔 思考"
              value: "🤔"
            - label: "💻 写代码"
              value: "💻"
            - label: "🚀 发布"
              value: "🚀"
            - label: "☕ 喝咖啡"
              value: "☕"
            - label: "📚 学习"
              value: "📚"
            - label: "🎧 听歌"
              value: "🎧"
            - label: "🌙 夜间模式"
              value: "🌙"
            - label: "🔥 忙碌"
              value: "🔥"
            - label: "✨ 灵感"
              value: "✨"
    - group: icons
      label: 图标配置
      formSchema:
        - $formkit: text
          name: home
          label: 首页图标（/）
          value: "line-md:home"
          help: 对应后台菜单链接 /，填写 Iconify 图标名称，例如 line-md:home
        - $formkit: text
          name: posts
          label: 文章图标（/archives）
          value: "octicon:repo-16"
          help: 对应后台菜单链接 /archives，填写 Iconify 图标名称，例如 octicon:repo-16
        - $formkit: text
          name: default_category
          label: 默认分类图标（/categories/default）
          value: "octicon:bookmark-16"
          help: 对应后台菜单链接 /categories/default，填写 Iconify 图标名称，例如 octicon:bookmark-16
        - $formkit: text
          name: about
          label: 关于图标（/about）
          value: "octicon:person-16"
          help: 对应后台菜单链接 /about，填写 Iconify 图标名称，例如 octicon:person-16
        - $formkit: text
          name: links
          label: 友链图标（/links）
          value: "ri:links-line"
          help: 对应后台菜单链接 /links，填写 Iconify 图标名称，例如 ri:links-line
        - $formkit: text
          name: photos
          label: 图库图标（/photos）
          value: "lineicons:photos"
          help: 对应后台菜单链接 /photos，填写 Iconify 图标名称，例如 lineicons:photos
        - $formkit: text
          name: moments
          label: 瞬间图标（/moments）
          value: "mingcute:moment-line"
          help: 对应后台菜单链接 /moments，填写 Iconify 图标名称，例如 mingcute:moment-line
        - $formkit: text
          name: message
          label: 留言板图标（/message）
          value: "tabler:message"
          help: 对应后台菜单链接 /message，填写 Iconify 图标名称，例如 tabler:message
        - $formkit: array
          name: custom_menu_icons
          label: 其他菜单栏自定义图标
          value: []
          addLabel: 添加菜单图标
          emptyText: 暂无自定义菜单图标，点击下方按钮添加
          help: 根据后台菜单栏路径逐条设置 Iconify 图标，例如 /tools 对应 octicon:tools-16
          itemLabels:
            - type: text
              label: "$value.path"
            - type: text
              label: "$value.icon"
          children:
            - $formkit: text
              name: path
              label: 菜单栏路径
              value: ""
              placeholder: "/tools"
              help: 填写后台菜单项的链接路径，建议以 / 开头
            - $formkit: text
              name: icon
              label: Iconify 图标名称
              value: "octicon:star-16"
              placeholder: "octicon:tools-16"
        - $formkit: text
          name: fallback
          label: 未匹配菜单默认图标
          value: "octicon:star-16"
          help: 只有菜单路径没有匹配到上面的自定义规则时才使用
    - group: about
      label: 关于设置
      formSchema:
        - $formkit: checkbox
          name: show_tags
          label: 显示个人标签
          value: true
        - $formkit: array
          name: tags
          label: 个人标签
          value:
            - text: "💻 运维开发"
            - text: "📚 终身学习"
            - text: "🏓 台球"
            - text: "⌨️ 击键爱好者"
            - text: "🛠️ AMT-er"
            - text: "🏁 INFA-J"
            - text: "🧑‍💻 技术实践"
            - text: "🚀 持续折腾"
          addLabel: 添加标签
          emptyText: 暂无个人标签
          itemLabels:
            - type: text
              label: "$value.text"
          children:
            - $formkit: text
              name: text
              label: 标签文字
              value: ""
              placeholder: "💻 运维开发"
        - $formkit: textarea
          name: intro
          label: 关于本站
          value: |-
            嗨，欢迎来到我的小站。这里是我存放运维笔记、记录日常点滴的自留地。

            一名闲不住、天天和服务器对线的运维人，平日主要调集群、排查各类线上故障，有空就折腾自动化脚本提升效率。

            本站一半记录生活碎片，一半分享一路走来踩过的运维坑与实操经验。
          help: 支持换行；留空时显示 Halo 关于页正文
        - $formkit: checkbox
          name: show_skills
          label: 显示技能与认证
          value: true
        - $formkit: array
          name: skills
          label: 技能与认证
          value:
            - name: "2025 · 信息技术处理员（软考）"
              icon: "octicon:verified-16"
              level: 100
            - name: "2025 · 信息系统运行管理员（软考）"
              icon: "octicon:verified-16"
              level: 100
            - name: "2025 · OCP（Oracle）"
              icon: "simple-icons:oracle"
              level: 88
            - name: "2025 · H3CNE（华三）"
              icon: "simple-icons:huawei"
              level: 90
            - name: "2021 · HCIP（华为）"
              icon: "simple-icons:huawei"
              level: 90
            - name: "2021 · HCIA（华为）"
              icon: "simple-icons:huawei"
              level: 95
            - name: "2019 · 软件工程师（人社部）"
              icon: "octicon:terminal-16"
              level: 100
            - name: "2018 · 中级程序员（人社部）"
              icon: "octicon:code-16"
              level: 100
            - name: "2017 · 初级程序员（人社部）"
              icon: "octicon:code-16"
              level: 100
            - name: "2015 · 计算机操作员三级（人社部）"
              icon: "octicon:device-desktop-16"
              level: 100
          addLabel: 添加技能或认证
          emptyText: 暂无技能与认证
          itemLabels:
            - type: text
              label: "$value.name"
          children:
            - $formkit: text
              name: name
              label: 名称
              value: ""
              placeholder: "2025 · 认证名称"
            - $formkit: text
              name: icon
              label: Iconify 图标
              value: "octicon:verified-16"
            - $formkit: number
              name: level
              label: 进度
              value: 100
              min: 0
              max: 100
              suffix: "%"
        - $formkit: checkbox
          name: show_history
          label: 显示建站历程
          value: true
        - $formkit: textarea
          name: history
          label: 建站历程
          value: |-
            最开始搭建这个博客，初衷很简单，只是为了存档工作里遇到的各类问题。

            日常运维工作总会碰到各式各样的故障、踩不完的坑，很多问题解决过后隔段时间就容易遗忘。于是便想着把排查思路、处理步骤、踩过的弯路全部记录下来。

            慢慢写着写着，博客不再仅仅是工作问题的知识库。
          help: 支持换行
        - $formkit: checkbox
          name: show_promise
          label: 显示十年之约
          value: true
        - $formkit: text
          name: promise_title
          label: 约定标题
          value: "十年之约"
        - $formkit: text
          name: promise_subtitle
          label: 约定描述
          value: "十年之约，写给这座博客，也写给未来的自己。"
        - $formkit: text
          name: promise_start
          label: 开始日期
          value: "2021-01-01"
          placeholder: "2021-01-01"
          help: 请使用 YYYY-MM-DD 格式
        - $formkit: text
          name: promise_end
          label: 目标日期
          value: "2031-01-01"
          placeholder: "2031-01-01"
          help: 请使用 YYYY-MM-DD 格式
        - $formkit: checkbox
          name: show_contacts
          label: 显示联系方式
          value: true
        - $formkit: array
          name: contacts
          label: 联系方式
          value:
            - label: "GitHub"
              url: "https://github.com/dengchuanfu"
              icon: "octicon:mark-github-16"
            - label: "Gitee"
              url: "https://gitee.com/dengchuanfu"
              icon: "simple-icons:gitee"
            - label: "RSS"
              url: "/rss.xml"
              icon: "octicon:rss-16"
          addLabel: 添加联系方式
          emptyText: 暂无联系方式
          itemLabels:
            - type: text
              label: "$value.label"
            - type: text
              label: "$value.url"
          children:
            - $formkit: text
              name: label
              label: 名称
              value: ""
              placeholder: "GitHub"
            - $formkit: text
              name: url
              label: 链接
              value: ""
              placeholder: "https://example.com"
            - $formkit: text
              name: icon
              label: Iconify 图标
              value: "octicon:link-16"
    - group: styles
      label: 样式
      formSchema:
        - $formkit: color
          name: background_color
          label: 背景颜色
          value: "#ffffff"
        - $formkit: color
          name: accent_color
          label: 强调色
          value: "#0969da"
        - $formkit: checkbox
          name: weather_enabled
          label: 启用天气显示
          value: false
          help: 开启后在顶部搜索框之后显示实时天气，数据来自无需密钥的 Open-Meteo
        - $formkit: checkbox
          name: weather_auto_location
          label: 优先使用访客定位
          value: true
          help: 首次访问会请求浏览器定位权限；拒绝或定位失败时使用下方预设城市
        - $formkit: text
          name: weather_location
          label: 天气城市名称
          value: "深圳"
          placeholder: "深圳"
          help: 访客定位不可用时显示的备用城市
        - $formkit: text
          name: weather_latitude
          label: 天气纬度
          value: "22.5431"
          placeholder: "22.5431"
          help: 例如深圳为 22.5431，可从地图服务查询城市坐标
        - $formkit: text
          name: weather_longitude
          label: 天气经度
          value: "114.0579"
          placeholder: "114.0579"
          help: 例如深圳为 114.0579，可从地图服务查询城市坐标
        - $formkit: checkbox
          name: music_player_enabled
          label: 启用悬浮播放器
          value: false
          help: 开启并填写歌单 ID 后，在前台显示播放器并尝试自动播放
        - $formkit: select
          name: music_player_position
          label: 播放器显示位置
          value: "bottom-left"
          options:
            - label: "左下角"
              value: "bottom-left"
            - label: "右上角"
              value: "top-right"
          help: 选择右上角后，播放器显示在顶部搜索框之后，采用紧凑的 macOS 音乐播放器样式
        - $formkit: select
          name: music_source
          label: 音乐数据源
          value: "netease"
          options:
            - label: "网易云音乐（默认接口）"
              value: "netease"
            - label: "自定义 API"
              value: "custom"
          help: 默认使用兼容 Meting 格式的网易云歌单接口；其他平台请选择自定义 API
        - $formkit: text
          name: music_playlist_id
          label: 歌单 ID
          value: ""
          placeholder: "例如 3778678"
          help: "网易云音乐请填写歌单 ID；自定义 API 可在接口地址中使用 {id} 引用此值"
        - $formkit: select
          name: music_playback_mode
          label: 默认播放模式
          value: "sequence"
          options:
            - label: "顺序播放"
              value: "sequence"
            - label: "随机播放"
              value: "shuffle"
          help: 首次打开播放器时使用；用户在前台切换的模式会在当前标签页内保持
        - $formkit: text
          name: music_api
          label: 音乐 API 地址
          value: "https://api.i-meto.com/meting/api?server=netease&type=playlist&id={id}"
          placeholder: "https://api.example.com/playlist?id={id}"
          help: "{id} 会替换为歌单 ID。接口需返回歌曲数组，或 data 包装的数组；单曲字段支持 title/name、artist/author、url 和 cover/pic"
    - group: links
      label: 友链设置
      formSchema:
        - $formkit: attachment
          name: link_default_avatar
          label: 友链默认头像
          value: ""
          accept: "image/*"
          help: 当友链未设置 Logo 或 Logo 加载失败时显示；留空时使用默认头像图标
        - $formkit: text
          name: link_application_site_name
          label: 本站友链名称
          value: ""
          placeholder: "留空时使用站点名称"
        - $formkit: text
          name: link_application_site_url
          label: 本站友链地址
          value: ""
          placeholder: "https://example.com"
          help: 留空时使用站点地址
        - $formkit: attachment
          name: link_application_site_logo
          label: 本站友链头像
          value: ""
          accept: "image/*"
          help: 留空时使用站点 Logo
        - $formkit: textarea
          name: link_application_site_description
          label: 本站友链描述
          value: ""
          placeholder: "留空时使用站点描述"
        - $formkit: text
          name: link_application_site_link_page
          label: 本站友链页面
          value: ""
          placeholder: "https://example.com/links"
          help: 留空时使用本站 /links 页面
        - $formkit: text
          name: link_application_site_rss_url
          label: 本站 RSS 订阅地址
          value: ""
          placeholder: "https://example.com/rss.xml"
          help: 留空时使用本站 /rss.xml 地址
        - $formkit: checkbox
          name: link_application_enabled
          label: 启用友链申请
          value: true
          help: 在友链页面显示本站友链资料和自助申请表单；申请会提交为留言板评论
        - $formkit: textarea
          name: link_application_note
          label: 友链申请说明
          value: "请先在贵站添加本站友链，提交后会作为留言发送，站长会手动审核。"
          help: 显示在友链申请区域，可填写审核规则或补充说明
    - group: footer
      label: 底部设置
      formSchema:
        - $formkit: text
          name: icp_number
          label: ICP 备案编号
          value: ""
          placeholder: "粤ICP备XXXXXXXX号"
          help: 只填写备案编号，图标和工信部查询链接由主题提供
        - $formkit: text
          name: public_security_number
          label: 公安备案编号
          value: ""
          placeholder: "粤公网安备 XXXXXXXXXXXXXX号"
          help: 只填写备案编号，图标和公安部查询链接由主题提供
        - $formkit: datetime-local
          name: site_start_time
          label: 站点开始运行时间
          value: ""
          step: 1
          help: 设置后在前端底部显示精确到秒的站点运行时间，留空则不显示
        - $formkit: text
          name: provider_name
          label: 云服务商名称
          value: ""
          placeholder: "腾讯云"
          help: 显示在“本站由 XX 提供服务”中，上传 Logo 后作为图片替代文字的辅助名称
        - $formkit: attachment
          name: provider_logo
          label: 云服务商 Logo
          value: ""
          accept: "image/*"
          help: 建议上传透明背景的横版 Logo，前端显示高度为 20px
        - $formkit: text
          name: provider_url
          label: 云服务商链接
          value: ""
          placeholder: "https://cloud.example.com"
          help: 点击云服务商 Logo 或名称时打开的地址
