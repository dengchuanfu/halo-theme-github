apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-theme-github-setting
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: name
          label: 站点信息设置 - 名称
          value: "Monster"
          help: 显示在大 Logo 下方的加粗名称
        - $formkit: textarea
          name: description
          label: 站点信息设置 - 描述
          value: "我是真滴帅～"
          help: 显示在加粗名称下方的灰色文字
        - $formkit: text
          name: location
          label: 所在地
          value: "ShenZhen"
        - $formkit: text
          name: company
          label: 公司 / 学校
          value: "社会大学"
        - $formkit: text
          name: email
          label: 邮箱
          value: ""
        - $formkit: checkbox
          name: show_stats
          label: 是否显示网站统计信息
          value: false
          help: 开启后在前端大 Logo 资料区显示总文章数量、总评论数量和总访问量
        - $formkit: select
          name: status
          label: 状态 Emoji
          value: "😊"
          help: 显示在前端大 Logo 右下角的小圆圈中
          options:
            - label: "😊 开心"
              value: "😊"
            - label: "🤔 思考"
              value: "🤔"
            - label: "💻 写代码"
              value: "💻"
            - label: "🚀 发布"
              value: "🚀"
            - label: "☕ 喝咖啡"
              value: "☕"
            - label: "📚 学习"
              value: "📚"
            - label: "🎧 听歌"
              value: "🎧"
            - label: "🌙 夜间模式"
              value: "🌙"
            - label: "🔥 忙碌"
              value: "🔥"
            - label: "✨ 灵感"
              value: "✨"
    - group: icons
      label: 图标配置
      formSchema:
        - $formkit: text
          name: home
          label: 首页图标（/）
          value: "line-md:home"
          help: 对应后台菜单链接 /，填写 Iconify 图标名称，例如 line-md:home
        - $formkit: text
          name: posts
          label: 文章图标（/archives）
          value: "octicon:repo-16"
          help: 对应后台菜单链接 /archives，填写 Iconify 图标名称，例如 octicon:repo-16
        - $formkit: text
          name: default_category
          label: 默认分类图标（/categories/default）
          value: "octicon:bookmark-16"
          help: 对应后台菜单链接 /categories/default，填写 Iconify 图标名称，例如 octicon:bookmark-16
        - $formkit: text
          name: about
          label: 关于图标（/about）
          value: "octicon:person-16"
          help: 对应后台菜单链接 /about，填写 Iconify 图标名称，例如 octicon:person-16
        - $formkit: text
          name: links
          label: 友链图标（/links）
          value: "ri:links-line"
          help: 对应后台菜单链接 /links，填写 Iconify 图标名称，例如 ri:links-line
        - $formkit: text
          name: photos
          label: 图库图标（/photos）
          value: "lineicons:photos"
          help: 对应后台菜单链接 /photos，填写 Iconify 图标名称，例如 lineicons:photos
        - $formkit: text
          name: moments
          label: 瞬间图标（/moments）
          value: "mingcute:moment-line"
          help: 对应后台菜单链接 /moments，填写 Iconify 图标名称，例如 mingcute:moment-line
        - $formkit: text
          name: message
          label: 留言板图标（/message）
          value: "tabler:message"
          help: 对应后台菜单链接 /message，填写 Iconify 图标名称，例如 tabler:message
        - $formkit: array
          name: custom_menu_icons
          label: 其他菜单栏自定义图标
          value: []
          addLabel: 添加菜单图标
          emptyText: 暂无自定义菜单图标，点击下方按钮添加
          help: 根据后台菜单栏路径逐条设置 Iconify 图标，例如 /tools 对应 octicon:tools-16
          itemLabels:
            - type: text
              label: "$value.path"
            - type: text
              label: "$value.icon"
          children:
            - $formkit: text
              name: path
              label: 菜单栏路径
              value: ""
              placeholder: "/tools"
              help: 填写后台菜单项的链接路径，建议以 / 开头
            - $formkit: text
              name: icon
              label: Iconify 图标名称
              value: "octicon:star-16"
              placeholder: "octicon:tools-16"
        - $formkit: text
          name: fallback
          label: 未匹配菜单默认图标
          value: "octicon:star-16"
          help: 只有菜单路径没有匹配到上面的自定义规则时才使用
    - group: about
      label: 关于设置
      formSchema:
        - $formkit: checkbox
          name: show_tags
          label: 显示个人标签
          value: true
        - $formkit: array
          name: tags
          label: 个人标签
          value:
            - text: "💻 运维开发"
            - text: "📚 终身学习"
            - text: "🏓 台球"
            - text: "⌨️ 击键爱好者"
            - text: "🛠️ AMT-er"
            - text: "🏁 INFA-J"
            - text: "🧑‍💻 技术实践"
            - text: "🚀 持续折腾"
          addLabel: 添加标签
          emptyText: 暂无个人标签
          itemLabels:
            - type: text
              label: "$value.text"
          children:
            - $formkit: text
              name: text
              label: 标签文字
              value: ""
              placeholder: "💻 运维开发"
        - $formkit: textarea
          name: intro
          label: 关于本站
          value: |-
            嗨，欢迎来到我的小站。这里是我存放运维笔记、记录日常点滴的自留地。

            一名闲不住、天天和服务器对线的运维人，平日主要调集群、排查各类线上故障，有空就折腾自动化脚本提升效率。

            本站一半记录生活碎片，一半分享一路走来踩过的运维坑与实操经验。
          help: 支持换行；留空时显示 Halo 关于页正文
        - $formkit: checkbox
          name: show_skills
          label: 显示技能与认证
          value: true
        - $formkit: array
          name: skills
          label: 技能与认证
          value:
            - name: "2025 · 信息技术处理员（软考）"
              icon: "octicon:verified-16"
              level: 100
            - name: "2025 · 信息系统运行管理员（软考）"
              icon: "octicon:verified-16"
              level: 100
            - name: "2025 · OCP（Oracle）"
              icon: "simple-icons:oracle"
              level: 88
            - name: "2025 · H3CNE（华三）"
              icon: "simple-icons:huawei"
              level: 90
            - name: "2021 · HCIP（华为）"
              icon: "simple-icons:huawei"
              level: 90
            - name: "2021 · HCIA（华为）"
              icon: "simple-icons:huawei"
              level: 95
            - name: "2019 · 软件工程师（人社部）"
              icon: "octicon:terminal-16"
              level: 100
            - name: "2018 · 中级程序员（人社部）"
              icon: "octicon:code-16"
              level: 100
            - name: "2017 · 初级程序员（人社部）"
              icon: "octicon:code-16"
              level: 100
            - name: "2015 · 计算机操作员三级（人社部）"
              icon: "octicon:device-desktop-16"
              level: 100
          addLabel: 添加技能或认证
          emptyText: 暂无技能与认证
          itemLabels:
            - type: text
              label: "$value.name"
          children:
            - $formkit: text
              name: name
              label: 名称
              value: ""
              placeholder: "2025 · 认证名称"
            - $formkit: text
              name: icon
              label: Iconify 图标
              value: "octicon:verified-16"
            - $formkit: number
              name: level
              label: 进度
              value: 100
              min: 0
              max: 100
              suffix: "%"
        - $formkit: checkbox
          name: show_history
          label: 显示建站历程
          value: true
        - $formkit: textarea
          name: history
          label: 建站历程
          value: |-
            始建于 2021 年，纯个人兴趣建站，记录技术与生活。

            记录生活中的点滴，分享技术探索的心得，收藏有趣的发现。

            经历了多次改版、换主题、折腾服务器，一直热爱支撑，毕竟它承载着成长和回忆。
          help: 支持换行
        - $formkit: checkbox
          name: show_promise
          label: 显示十年之约
          value: true
        - $formkit: text
          name: promise_title
          label: 约定标题
          value: "十年之约"
        - $formkit: text
          name: promise_subtitle
          label: 约定描述
          value: "一个人的寂寞，一群人的狂欢"
        - $formkit: text
          name: promise_start
          label: 开始日期
          value: "2021-01-01"
          placeholder: "2021-01-01"
          help: 请使用 YYYY-MM-DD 格式
        - $formkit: text
          name: promise_end
          label: 目标日期
          value: "2031-01-01"
          placeholder: "2031-01-01"
          help: 请使用 YYYY-MM-DD 格式
        - $formkit: checkbox
          name: show_contacts
          label: 显示联系方式
          value: true
        - $formkit: array
          name: contacts
          label: 联系方式
          value:
            - label: "GitHub"
              url: "https://github.com/dengchuanfu"
              icon: "octicon:mark-github-16"
            - label: "Gitee"
              url: "https://gitee.com/dengchuanfu"
              icon: "simple-icons:gitee"
            - label: "RSS"
              url: "/rss.xml"
              icon: "octicon:rss-16"
          addLabel: 添加联系方式
          emptyText: 暂无联系方式
          itemLabels:
            - type: text
              label: "$value.label"
            - type: text
              label: "$value.url"
          children:
            - $formkit: text
              name: label
              label: 名称
              value: ""
              placeholder: "GitHub"
            - $formkit: text
              name: url
              label: 链接
              value: ""
              placeholder: "https://example.com"
            - $formkit: text
              name: icon
              label: Iconify 图标
              value: "octicon:link-16"
    - group: styles
      label: 样式
      formSchema:
        - $formkit: color
          name: background_color
          label: 背景颜色
          value: "#ffffff"
        - $formkit: color
          name: accent_color
          label: 强调色
          value: "#0969da"
        - $formkit: attachment
          name: link_default_avatar
          label: 友链默认头像
          value: ""
          accept: "image/*"
          help: 当友链未设置 Logo 或 Logo 加载失败时显示；留空时使用默认头像图标
    - group: footer
      label: 底部设置
      formSchema:
        - $formkit: text
          name: icp_number
          label: ICP 备案编号
          value: ""
          placeholder: "粤ICP备XXXXXXXX号"
          help: 只填写备案编号，图标和工信部查询链接由主题提供
        - $formkit: text
          name: public_security_number
          label: 公安备案编号
          value: ""
          placeholder: "粤公网安备 XXXXXXXXXXXXXX号"
          help: 只填写备案编号，图标和公安部查询链接由主题提供
        - $formkit: text
          name: provider_name
          label: 云服务商名称
          value: ""
          placeholder: "腾讯云"
          help: 显示在“本站由 XX 提供服务”中，上传 Logo 后作为图片替代文字的辅助名称
        - $formkit: attachment
          name: provider_logo
          label: 云服务商 Logo
          value: ""
          accept: "image/*"
          help: 建议上传透明背景的横版 Logo，前端显示高度为 20px
        - $formkit: text
          name: provider_url
          label: 云服务商链接
          value: ""
          placeholder: "https://cloud.example.com"
          help: 点击云服务商 Logo 或名称时打开的地址
