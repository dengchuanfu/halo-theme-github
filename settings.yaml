apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-theme-github-setting
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: title
          label: 站点信息设置 - 标题
          value: "monster"
          help: 显示在顶部站点 Logo 右侧
        - $formkit: text
          name: name
          label: 站点信息设置 - 名称
          value: "Monster"
          help: 显示在大 Logo 下方的加粗名称
        - $formkit: textarea
          name: description
          label: 站点信息设置 - 描述
          value: "dengchuanfu"
          help: 显示在加粗名称下方的灰色文字
        - $formkit: text
          name: location
          label: 所在地
          value: "ShenZhen"
        - $formkit: text
          name: company
          label: 公司 / 学校
          value: "EasySpeed"
        - $formkit: text
          name: email
          label: 邮箱
          value: ""
        - $formkit: checkbox
          name: show_stats
          label: 是否显示网站统计信息
          value: false
          help: 开启后在前端大 Logo 资料区显示总文章数量、总评论数量和总访问量
        - $formkit: select
          name: status
          label: 状态 Emoji
          value: "😊"
          help: 显示在前端大 Logo 右下角的小圆圈中
          options:
            - label: "😊 开心"
              value: "😊"
            - label: "🤔 思考"
              value: "🤔"
            - label: "💻 写代码"
              value: "💻"
            - label: "🚀 发布"
              value: "🚀"
            - label: "☕ 喝咖啡"
              value: "☕"
            - label: "📚 学习"
              value: "📚"
            - label: "🎧 听歌"
              value: "🎧"
            - label: "🌙 夜间模式"
              value: "🌙"
            - label: "🔥 忙碌"
              value: "🔥"
            - label: "✨ 灵感"
              value: "✨"
    - group: icons
      label: 图标配置
      formSchema:
        - $formkit: text
          name: home
          label: 首页图标（/）
          value: "line-md:home"
          help: 对应后台菜单链接 /，填写 Iconify 图标名称，例如 line-md:home
        - $formkit: text
          name: posts
          label: 文章图标（/archives）
          value: "octicon:repo-16"
          help: 对应后台菜单链接 /archives，填写 Iconify 图标名称，例如 octicon:repo-16
        - $formkit: text
          name: default_category
          label: 默认分类图标（/categories/default）
          value: "octicon:bookmark-16"
          help: 对应后台菜单链接 /categories/default，填写 Iconify 图标名称，例如 octicon:bookmark-16
        - $formkit: text
          name: about
          label: 关于图标（/about）
          value: "octicon:person-16"
          help: 对应后台菜单链接 /about，填写 Iconify 图标名称，例如 octicon:person-16
        - $formkit: text
          name: links
          label: 友链图标（/links）
          value: "ri:links-line"
          help: 对应后台菜单链接 /links，填写 Iconify 图标名称，例如 ri:links-line
        - $formkit: text
          name: photos
          label: 图库图标（/photos）
          value: "lineicons:photos"
          help: 对应后台菜单链接 /photos，填写 Iconify 图标名称，例如 lineicons:photos
        - $formkit: text
          name: moments
          label: 瞬间图标（/moments）
          value: "mingcute:moment-line"
          help: 对应后台菜单链接 /moments，填写 Iconify 图标名称，例如 mingcute:moment-line
        - $formkit: text
          name: message
          label: 留言板图标（/message）
          value: "tabler:message"
          help: 对应后台菜单链接 /message，填写 Iconify 图标名称，例如 tabler:message
        - $formkit: array
          name: custom_menu_icons
          label: 其他菜单栏自定义图标
          value: []
          addLabel: 添加菜单图标
          emptyText: 暂无自定义菜单图标，点击下方按钮添加
          help: 根据后台菜单栏路径逐条设置 Iconify 图标，例如 /tools 对应 octicon:tools-16
          itemLabels:
            - type: text
              label: "$value.path"
            - type: text
              label: "$value.icon"
          children:
            - $formkit: text
              name: path
              label: 菜单栏路径
              value: ""
              placeholder: "/tools"
              help: 填写后台菜单项的链接路径，建议以 / 开头
            - $formkit: text
              name: icon
              label: Iconify 图标名称
              value: "octicon:star-16"
              placeholder: "octicon:tools-16"
        - $formkit: text
          name: fallback
          label: 未匹配菜单默认图标
          value: "octicon:star-16"
          help: 只有菜单路径没有匹配到上面的自定义规则时才使用
    - group: styles
      label: 样式
      formSchema:
        - $formkit: color
          name: background_color
          label: 背景颜色
          value: "#ffffff"
        - $formkit: color
          name: accent_color
          label: 强调色
          value: "#0969da"
        - $formkit: attachment
          name: link_default_avatar
          label: 友链默认头像
          value: ""
          accept: "image/*"
          help: 当友链未设置 Logo 或 Logo 加载失败时显示，留空则保持默认占位样式
    - group: footer
      label: 底部设置
      formSchema:
        - $formkit: text
          name: icp_number
          label: ICP 备案编号
          value: ""
          placeholder: "粤ICP备XXXXXXXX号"
          help: 只填写备案编号，图标和工信部查询链接由主题提供
        - $formkit: text
          name: public_security_number
          label: 公安备案编号
          value: ""
          placeholder: "粤公网安备 XXXXXXXXXXXXXX号"
          help: 只填写备案编号，图标和公安部查询链接由主题提供
        - $formkit: text
          name: provider_name
          label: 云服务商名称
          value: ""
          placeholder: "腾讯云"
          help: 显示在“本站由 XX 提供服务”中，上传 Logo 后作为图片替代文字的辅助名称
        - $formkit: attachment
          name: provider_logo
          label: 云服务商 Logo
          value: ""
          accept: "image/*"
          help: 建议上传透明背景的横版 Logo，前端显示高度为 20px
        - $formkit: text
          name: provider_url
          label: 云服务商链接
          value: ""
          placeholder: "https://cloud.example.com"
          help: 点击云服务商 Logo 或名称时打开的地址
