<include
  src="layout.html"
  activeHome=""
  activePosts=""
  activeProjects=""
  activePackages=""
  shellClass="github-shell-full"
  sidebarClass="is-hidden"
  contentClass="content-column-full"
>
  <template name="head">
    <title th:text="|${title ?: '图库'} - ${theme.config.basic.title ?: site.title}|">图库</title>
  </template>

  <section class="photos-page">
    <header class="links-hero photos-hero">
      <div>
        <p class="links-eyebrow">Photos</p>
        <h1 th:text="${title ?: '图库'}">图库</h1>
        <p>把照片按分组铺开，像浏览项目截图一样轻松查看。</p>
      </div>
      <span class="links-count" th:if="${photos != null}">
        <span th:text="${photos.total ?: 0}">0</span>
        <span>张照片</span>
      </span>
    </header>

    <nav class="photos-tabs" th:if="${photoFinder != null}">
      <a
        class="tag"
        th:href="@{/photos}"
        th:classappend="${#lists.isEmpty(param.group) ? 'is-active' : ''}"
      >
        全部
      </a>
      <a
        class="tag"
        th:each="group : ${photoFinder.groupBy()}"
        th:href="@{|/photos?group=${group.metadata.name}|}"
        th:classappend="${#lists.contains(param.group, group.metadata.name) ? 'is-active' : ''}"
        th:text="${group.spec.displayName}"
      ></a>
    </nav>

    <div class="links-empty" th:if="${photos == null or #lists.isEmpty(photos.items)}">
      <iconify-icon icon="octicon:image-16"></iconify-icon>
      <h2>暂无照片</h2>
      <p>在图库管理插件里上传照片后，这里会自动显示。</p>
    </div>

    <div class="photos-grid" th:if="${photos != null and not #lists.isEmpty(photos.items)}">
      <a
        class="photo-card"
        th:each="photo : ${photos.items}"
        th:href="${photo.spec.url}"
        target="_blank"
        rel="noreferrer"
      >
        <img
          th:src="${photo.spec.url}"
          th:alt="${photo.spec.displayName ?: 'Photo'}"
          loading="lazy"
        />
        <span class="photo-card-title" th:if="${not #strings.isEmpty(photo.spec.displayName)}">
          <span th:text="${photo.spec.displayName}">Photo</span>
        </span>
      </a>
    </div>
  </section>

  <nav class="pagination" th:if="${photos != null and (photos.hasPrevious() || photos.hasNext())}">
    <a th:if="${photos.hasPrevious()}" th:href="@{${photos.prevUrl}}">Previous</a>
    <span th:text="|${photos.page} / ${photos.totalPages}|"></span>
    <a th:if="${photos.hasNext()}" th:href="@{${photos.nextUrl}}">Next</a>
  </nav>
</include>
