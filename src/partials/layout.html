<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <slot name="head">
      <title th:text="${site.title}">Site Title</title>
    </slot>
    <script type="module" src="./js/main.ts"></script>
  </head>
  <body
    th:style="|--configured-page-bg: ${theme.config.styles.background_color ?: '#ffffff'}; --configured-accent: ${theme.config.styles.accent_color ?: '#0969da'}|"
  >
    <header class="github-header">
      <div class="header-inner">
        <a class="octo-mark" th:href="@{/}" aria-label="Home">
          <img
            th:src="${site.logo ?: 'https://github.com/dengchuanfu.png?size=80'}"
            th:alt="${site.title}"
          />
        </a>
        <a class="site-title" th:href="@{/}" th:text="${site.title}">monster</a>
        <button class="search-box" type="button" data-search-trigger aria-label="Search">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"
            />
          </svg>
          <span>Search or jump to...</span>
        </button>
        <div class="header-actions">
          <button
            class="icon-button theme-toggle"
            type="button"
            aria-label="切换到黑夜模式"
            aria-pressed="false"
            title="切换到黑夜模式"
            data-theme-toggle
          >
            <iconify-icon icon="solar:sun-linear" aria-hidden="true"></iconify-icon>
          </button>
          <div class="publish-menu">
            <button
              class="icon-button wide-icon"
              type="button"
              aria-label="Create new"
              aria-haspopup="menu"
              aria-expanded="false"
              data-publish-menu-trigger
            >
              <iconify-icon icon="line-md:plus" aria-hidden="true"></iconify-icon>
              <span class="chevron"></span>
            </button>
            <div class="publish-menu-list" role="menu" data-publish-menu hidden>
              <a th:href="@{/console/posts/editor}" role="menuitem">发布文章</a>
              <a th:href="@{/console/moments}" role="menuitem">发布瞬间</a>
              <a th:href="@{/console/photos}" role="menuitem">上传图库</a>
            </div>
          </div>
          <a
            class="icon-button notification-link"
            th:href="@{/uc/notifications}"
            aria-label="Notifications"
            data-notification-link
          >
            <iconify-icon icon="ix:notifications" aria-hidden="true"></iconify-icon>
            <span class="notification-dot" data-notification-dot hidden></span>
          </a>
          <div class="user-menu" data-user-menu>
            <a class="icon-button login-link" th:href="@{/login}" aria-label="登录" data-login-link>
              <iconify-icon icon="material-symbols:login" aria-hidden="true"></iconify-icon>
            </a>
            <button
              class="header-avatar"
              type="button"
              aria-label="用户菜单"
              aria-haspopup="menu"
              aria-expanded="false"
              data-user-menu-trigger
              hidden
            >
              <img
                th:src="${site.logo ?: 'https://github.com/dengchuanfu.png?size=80'}"
                th:alt="${theme.config.basic.name ?: site.title}"
                data-user-avatar
              />
            </button>
            <div class="user-menu-list" role="menu" data-user-menu-list hidden>
              <a th:href="@{/console}" role="menuitem">控制台</a>
              <a th:href="@{/logout}" role="menuitem">退出</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="search-overlay" data-search-overlay hidden>
      <div class="search-dialog" role="dialog" aria-modal="true" aria-label="Search">
        <form class="search-dialog-form" data-search-form>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"
            />
          </svg>
          <input
            data-search-input
            type="search"
            name="keyword"
            autocomplete="off"
            placeholder="搜索文章..."
            aria-label="搜索文章"
          />
          <button type="button" data-search-close aria-label="Close search">Esc</button>
        </form>
        <div class="search-status" data-search-status>输入关键词搜索</div>
        <div class="search-results" data-search-results></div>
      </div>
    </div>

    <nav
      class="profile-tabs"
      th:with="siteStats=${siteStatsFinder.getStats()}, menu=${menuFinder.getPrimary()}"
    >
      <th:block th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}">
        <a
          th:each="item : ${menu.menuItems}"
          th:with="
            menuHref=${item.status.href ?: ''},
            isHomeMenu=${menuHref == '/' or menuHref == ''},
            isPostsMenu=${menuHref == '/archives' or menuHref == 'archives' or #strings.startsWith(menuHref, '/archives')},
            isDefaultCategoryMenu=${menuHref == '/categories/default' or menuHref == 'categories/default'},
            isCategoryMenu=${menuHref == '/categories' or menuHref == 'categories' or #strings.startsWith(menuHref, '/categories')},
            isTagsMenu=${menuHref == '/tags' or menuHref == 'tags' or #strings.startsWith(menuHref, '/tags')},
            isAboutMenu=${menuHref == '/about' or menuHref == 'about'},
            isLinksMenu=${menuHref == '/links' or menuHref == 'links' or #strings.startsWith(menuHref, '/links')},
            isPhotosMenu=${menuHref == '/photos' or menuHref == 'photos' or #strings.startsWith(menuHref, '/photos')},
            isMomentsMenu=${menuHref == '/moments' or menuHref == 'moments' or #strings.startsWith(menuHref, '/moments')},
            isMessageMenu=${menuHref == '/message' or menuHref == 'message' or #strings.startsWith(menuHref, '/message')},
            customMenuIcon=${theme.config.icons.custom_menu_icons != null ? theme.config.icons.custom_menu_icons.^[
              #this.path == menuHref or ('/' + #this.path) == menuHref or #this.path == ('/' + menuHref)
            ] : null}
          "
          th:href="@{${item.status.href}}"
          th:target="${item.spec.target?.value}"
          th:attr="data-menu-href=${item.status.href}"
          th:classappend="${(
            (isHomeMenu and '{{activeHome}}' == 'is-active') or
            (isPostsMenu and '{{activePosts}}' == 'is-active') or
            (isCategoryMenu and '{{activeProjects}}' == 'is-active') or
            (isTagsMenu and '{{activePackages}}' == 'is-active') or
            (singlePage != null and singlePage.status?.permalink != null and (singlePage.status.permalink == menuHref or #strings.endsWith(singlePage.status.permalink, menuHref)))
          ) ? 'is-active' : ''}"
        >
          <iconify-icon
            class="tab-icon"
            th:attr="icon=${
              isHomeMenu
                ? (theme.config.icons.home ?: 'line-md:home')
                : (isPostsMenu
                  ? (theme.config.icons.posts ?: 'octicon:repo-16')
                  : (isDefaultCategoryMenu
                    ? (theme.config.icons.default_category ?: 'octicon:bookmark-16')
                    : (isAboutMenu
                      ? (theme.config.icons.about ?: 'octicon:person-16')
                      : (isLinksMenu
                        ? (theme.config.icons.links ?: 'ri:links-line')
                        : (isPhotosMenu
                          ? (theme.config.icons.photos ?: 'lineicons:photos')
                          : (isMomentsMenu
                            ? (theme.config.icons.moments ?: 'mingcute:moment-line')
                            : (isMessageMenu
                              ? (theme.config.icons.message ?: 'tabler:message')
                              : (customMenuIcon != null and customMenuIcon.icon != null and customMenuIcon.icon != ''
                                ? customMenuIcon.icon
                                : (theme.config.icons.fallback ?: theme.config.icons.other ?: theme.config.icons.stars ?: 'octicon:star-16')))))))))
            }"
          ></iconify-icon>
          <span th:text="${item.status.displayName}">菜单</span>
          <span class="counter" th:if="${isPostsMenu}" th:text="${siteStats.post ?: 0}">0</span>
        </a>
      </th:block>

      <th:block th:if="${menu == null or #lists.isEmpty(menu.menuItems)}">
        <a class="{{activeHome}}" th:href="@{/}">
          <iconify-icon
            class="tab-icon"
            th:attr="icon=${theme.config.icons.home ?: 'line-md:home'}"
          ></iconify-icon>
          <span>首页</span>
        </a>
        <a class="{{activePosts}}" th:href="@{/archives}">
          <iconify-icon
            class="tab-icon"
            th:attr="icon=${theme.config.icons.posts ?: 'octicon:repo-16'}"
          ></iconify-icon>
          <span>文章</span>
          <span class="counter" th:text="${siteStats.post ?: 0}">0</span>
        </a>
        <a class="{{activeProjects}}" th:href="@{/categories/default}">
          <iconify-icon
            class="tab-icon"
            th:attr="icon=${theme.config.icons.default_category ?: 'octicon:bookmark-16'}"
          ></iconify-icon>
          <span>默认分类</span>
        </a>
        <a class="{{activeHome}}" th:href="@{/about}">
          <iconify-icon
            class="tab-icon"
            th:attr="icon=${theme.config.icons.about ?: 'octicon:person-16'}"
          ></iconify-icon>
          <span>关于</span>
        </a>
      </th:block>
    </nav>

    <div data-menu-icon-rules hidden th:if="${theme.config.icons.custom_menu_icons != null}">
      <span
        th:each="menuIcon : ${theme.config.icons.custom_menu_icons}"
        th:attr="data-menu-path=${menuIcon.path}, data-menu-icon=${menuIcon.icon}"
      ></span>
    </div>

    <main class="site-main github-shell {{shellClass}}">
      <aside class="profile-sidebar {{sidebarClass}}">
        <div class="profile-card">
          <img
            class="profile-avatar"
            th:src="${site.logo ?: 'https://avatars.githubusercontent.com/u/9919?s=240&v=4'}"
            th:alt="${theme.config.basic.name ?: site.title}"
          />
          <div
            class="profile-status"
            tabindex="0"
            th:with="
              statusEmoji=${theme.config.basic.status ?: '☺'},
              statusText=${statusEmoji == '😊' ? '开心' : statusEmoji == '🤔' ? '思考' : statusEmoji == '💻' ? '写代码' : statusEmoji == '🚀' ? '发布' : statusEmoji == '☕' ? '喝咖啡' : statusEmoji == '📚' ? '学习' : statusEmoji == '🎧' ? '听歌' : statusEmoji == '🌙' ? '夜间模式' : statusEmoji == '🔥' ? '忙碌' : statusEmoji == '✨' ? '灵感' : '状态 Emoji'}
            "
            th:attr="data-status-text=${statusText}, aria-label=${statusText}"
          >
            <span th:text="${statusEmoji}">😊</span>
          </div>
          <h1 class="profile-name" th:text="${theme.config.basic.name ?: site.title}">GitHub</h1>
          <p class="profile-username" th:text="${theme.config.basic.description ?: 'halo-user'}">
            halo-user
          </p>
          <a
            class="profile-button"
            th:if="${singlePage != null and singlePage.spec.slug == 'about'}"
            th:href="@{/console/theme/settings/about}"
            target="_blank"
            rel="noreferrer"
            >编辑关于</a
          >
          <a
            class="profile-button"
            th:if="${singlePage != null and singlePage.spec.template == 'message.html'}"
            th:href="@{/console/comments}"
            target="_blank"
            rel="noreferrer"
            >管理留言</a
          >
          <a
            class="profile-button"
            th:if="${(singlePage == null or (singlePage.spec.slug != 'about' and singlePage.spec.template != 'message.html')) and linksTitle != null}"
            th:href="@{/console/links}"
            target="_blank"
            rel="noreferrer"
            >管理友链</a
          >
          <a
            class="profile-button"
            th:if="${linksTitle == null and (category != null or categories != null)}"
            th:href="@{/console/posts/categories}"
            target="_blank"
            rel="noreferrer"
            >管理分类</a
          >
          <a
            class="profile-button"
            th:if="${linksTitle == null and category == null and categories == null and (moment != null or moments != null)}"
            th:href="@{/console/moments}"
            target="_blank"
            rel="noreferrer"
            >发布瞬间</a
          >
          <a
            class="profile-button"
            th:if="${linksTitle == null and category == null and categories == null and moment == null and moments == null and (post != null or archives != null)}"
            th:href="@{/console/posts/editor}"
            target="_blank"
            rel="noreferrer"
            >发布文章</a
          >
          <a
            class="profile-button"
            th:if="${'{{activeHome}}' == 'is-active'}"
            th:href="@{/console}"
            target="_blank"
            rel="noreferrer"
            >后台管理</a
          >
          <a
            class="profile-button"
            th:unless="${(singlePage != null and (singlePage.spec.slug == 'about' or singlePage.spec.template == 'message.html')) or linksTitle != null or category != null or categories != null or moment != null or moments != null or post != null or archives != null or '{{activeHome}}' == 'is-active'}"
            th:href="@{/console}"
            target="_blank"
            rel="noreferrer"
            >Edit profile</a
          >
          <ul class="profile-meta">
            <th:block th:if="${not #lists.isEmpty(theme.config.basic.profile_meta)}">
              <li th:each="item : ${theme.config.basic.profile_meta}" th:if="${item.text}">
                <iconify-icon
                  class="meta-icon"
                  th:attr="icon=${item.icon ?: 'octicon:info-16'}"
                ></iconify-icon>
                <a
                  th:if="${not #strings.isEmpty(item.url)}"
                  th:href="${item.url}"
                  th:attr="target=${#strings.startsWith(item.url, 'http') ? '_blank' : null}, rel=${#strings.startsWith(item.url, 'http') ? 'noreferrer' : null}"
                  th:text="${item.text}"
                ></a>
                <span th:if="${#strings.isEmpty(item.url)}" th:text="${item.text}"></span>
              </li>
            </th:block>
            <th:block th:if="${#lists.isEmpty(theme.config.basic.profile_meta)}">
              <li th:if="${theme.config.basic.company}">
                <iconify-icon class="meta-icon" icon="octicon:organization-16"></iconify-icon>
                <span th:text="${theme.config.basic.company}">Company</span>
              </li>
              <li th:if="${theme.config.basic.location}">
                <iconify-icon class="meta-icon" icon="octicon:location-16"></iconify-icon>
                <span th:text="${theme.config.basic.location}">Location</span>
              </li>
              <li th:if="${theme.config.basic.email}">
                <iconify-icon class="meta-icon" icon="octicon:mail-16"></iconify-icon>
                <a
                  th:href="|mailto:${theme.config.basic.email}|"
                  th:text="${theme.config.basic.email}"
                ></a>
              </li>
            </th:block>
            <li
              class="profile-stats-row"
              th:if="${theme.config.basic.show_stats}"
              th:with="siteStats=${siteStatsFinder.getStats()}"
            >
              <a th:href="@{/archives}">
                <span class="profile-stat-count" th:text="${siteStats.post ?: 0}">0</span>
                <span>文章</span>
              </a>
              <span class="profile-stat-separator">·</span>
              <span>
                <span class="profile-stat-count" th:text="${siteStats.comment ?: 0}">0</span>
                <span>评论</span>
              </span>
              <span class="profile-stat-separator">·</span>
              <span>
                <span class="profile-stat-count" th:text="${siteStats.visit ?: 0}">0</span>
                <span>访问</span>
              </span>
            </li>
          </ul>
        </div>
      </aside>
      <div class="content-column {{contentClass}}">
        <slot />
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner" th:with="footerConfig=${theme.config.footer}">
        <div class="footer-primary">
          <span class="footer-copyright">
            <span aria-hidden="true">©</span>
            <span th:text="${#temporals.year(#temporals.createNow())}">2026</span>
            <strong th:text="${site.title}">站点名称</strong>
            <span>保留所有权利</span>
          </span>
          <span class="footer-halo"><halo:footer /></span>
        </div>

        <div
          class="footer-records"
          th:if="${footerConfig != null and (not #strings.isEmpty(footerConfig.icp_number) or not #strings.isEmpty(footerConfig.public_security_number))}"
        >
          <a
            th:if="${not #strings.isEmpty(footerConfig.icp_number)}"
            href="https://beian.miit.gov.cn/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <iconify-icon icon="ri:shield-check-line"></iconify-icon>
            <span th:text="${footerConfig.icp_number}">粤ICP备XXXXXXXX号</span>
          </a>
          <a
            th:if="${not #strings.isEmpty(footerConfig.public_security_number)}"
            href="https://beian.mps.gov.cn/#/query/webSearch"
            target="_blank"
            rel="noopener noreferrer"
          >
            <iconify-icon icon="ri:police-badge-line"></iconify-icon>
            <span th:text="${footerConfig.public_security_number}">
              粤公网安备 XXXXXXXXXXXXXX号
            </span>
          </a>
        </div>

        <div
          class="footer-provider"
          th:if="${footerConfig != null and (not #strings.isEmpty(footerConfig.provider_name) or not #strings.isEmpty(footerConfig.provider_logo))}"
        >
          <span>本站由</span>
          <a
            th:if="${not #strings.isEmpty(footerConfig.provider_url)}"
            th:href="${footerConfig.provider_url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              th:if="${not #strings.isEmpty(footerConfig.provider_logo)}"
              th:src="${footerConfig.provider_logo}"
              th:alt="${footerConfig.provider_name ?: '云服务商'}"
            />
            <span
              th:if="${#strings.isEmpty(footerConfig.provider_logo)}"
              th:text="${footerConfig.provider_name}"
              >云服务商</span
            >
          </a>
          <span
            class="footer-provider-static"
            th:if="${#strings.isEmpty(footerConfig.provider_url)}"
          >
            <img
              th:if="${not #strings.isEmpty(footerConfig.provider_logo)}"
              th:src="${footerConfig.provider_logo}"
              th:alt="${footerConfig.provider_name ?: '云服务商'}"
            />
            <span
              th:if="${#strings.isEmpty(footerConfig.provider_logo)}"
              th:text="${footerConfig.provider_name}"
              >云服务商</span
            >
          </span>
          <span>提供服务</span>
        </div>
      </div>
    </footer>
  </body>
</html>
