<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <slot name="head">
      <title th:text="${theme.config.basic.title ?: site.title}">Site Title</title>
    </slot>
    <script type="module" src="./js/main.ts"></script>
  </head>
  <body
    th:style="|--page-bg: ${theme.config.styles.background_color ?: '#ffffff'}; --accent: ${theme.config.styles.accent_color ?: '#0969da'}|"
  >
    <header class="github-header">
      <div class="header-inner">
        <button class="icon-button menu-button" type="button" aria-label="Menu">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75Zm.75 4.25a.75.75 0 0 0 0 1.5h12.5a.75.75 0 0 0 0-1.5H1.75Z"
            />
          </svg>
        </button>
        <a class="octo-mark" th:href="@{/}" aria-label="Home">
          <img
            th:src="${site.logo ?: 'https://github.com/dengchuanfu.png?size=80'}"
            th:alt="${theme.config.basic.title ?: site.title}"
          />
        </a>
        <a class="site-title" th:href="@{/}" th:text="${theme.config.basic.title ?: site.title}"
          >monster</a
        >
        <button class="search-box" type="button" data-search-trigger aria-label="Search">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"
            />
          </svg>
          <span>Type <kbd>/</kbd> to search</span>
        </button>
        <div class="header-actions">
          <button class="icon-button wide-icon" type="button" aria-label="Copilot">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M6.5 2.25a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 .75.75v.35A5.5 5.5 0 0 1 13.5 8v1.75A2.25 2.25 0 0 1 11.25 12h-.75v.75a.75.75 0 0 1-1.5 0V12H7v.75a.75.75 0 0 1-1.5 0V12h-.75A2.25 2.25 0 0 1 2.5 9.75V8a5.5 5.5 0 0 1 4-5.4ZM4 8v1.75c0 .41.34.75.75.75h6.5c.41 0 .75-.34.75-.75V8a4 4 0 0 0-8 0Zm2.25.5a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Zm3.5 0a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z"
              />
            </svg>
            <span class="chevron"></span>
          </button>
          <span class="divider"></span>
          <button class="icon-button wide-icon" type="button" aria-label="Create new">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M7.25 2a.75.75 0 0 1 1.5 0v5.25H14a.75.75 0 0 1 0 1.5H8.75V14a.75.75 0 0 1-1.5 0V8.75H2a.75.75 0 0 1 0-1.5h5.25Z"
              />
            </svg>
            <span class="chevron"></span>
          </button>
          <button class="icon-button" type="button" aria-label="Issues">●</button>
          <button class="icon-button" type="button" aria-label="Pull requests">⑂</button>
          <button class="icon-button" type="button" aria-label="Inbox">▱</button>
          <a class="header-avatar" th:href="@{/console}" aria-label="Profile">
            <span class="notification-dot"></span>
            <img
              th:src="${site.logo ?: 'https://github.com/dengchuanfu.png?size=80'}"
              th:alt="${theme.config.basic.name ?: site.title}"
            />
          </a>
        </div>
      </div>
    </header>

    <div class="search-overlay" data-search-overlay hidden>
      <div class="search-dialog" role="dialog" aria-modal="true" aria-label="Search">
        <form class="search-dialog-form" data-search-form>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"
            />
          </svg>
          <input
            data-search-input
            type="search"
            name="keyword"
            autocomplete="off"
            placeholder="搜索文章..."
            aria-label="搜索文章"
          />
          <button type="button" data-search-close aria-label="Close search">Esc</button>
        </form>
        <div class="search-status" data-search-status>输入关键词搜索</div>
        <div class="search-results" data-search-results></div>
      </div>
    </div>

    <nav class="profile-tabs">
      <a class="is-active" th:href="@{/}">
        <iconify-icon
          class="tab-icon"
          th:attr="icon=${theme.config.icons.home ?: 'octicon:book-16'}"
        ></iconify-icon>
        <span>首页</span>
      </a>
      <a th:href="@{/archives}">
        <iconify-icon
          class="tab-icon"
          th:attr="icon=${theme.config.icons.posts ?: 'octicon:repo-16'}"
        ></iconify-icon>
        <span>文章</span>
        <span class="counter">6</span>
      </a>
      <a th:href="@{/categories}">
        <iconify-icon
          class="tab-icon"
          th:attr="icon=${theme.config.icons.projects ?: 'octicon:project-16'}"
        ></iconify-icon>
        <span>Projects</span>
      </a>
      <a th:href="@{/tags}">
        <iconify-icon
          class="tab-icon"
          th:attr="icon=${theme.config.icons.packages ?: 'octicon:package-16'}"
        ></iconify-icon>
        <span>Packages</span>
      </a>
      <a href="#">
        <iconify-icon
          class="tab-icon"
          th:attr="icon=${theme.config.icons.stars ?: 'octicon:star-16'}"
        ></iconify-icon>
        <span>Stars</span>
      </a>
    </nav>

    <main class="site-main github-shell">
      <aside class="profile-sidebar">
        <div class="profile-card">
          <img
            class="profile-avatar"
            th:src="${site.logo ?: 'https://avatars.githubusercontent.com/u/9919?s=240&v=4'}"
            th:alt="${theme.config.basic.name ?: site.title}"
          />
          <div class="profile-status">
            <span th:if="${theme.config.basic.status}" th:text="${theme.config.basic.status}"
              >Available</span
            >
            <span th:unless="${theme.config.basic.status}">☺</span>
          </div>
          <h1 class="profile-name" th:text="${theme.config.basic.name ?: site.title}">GitHub</h1>
          <p class="profile-username" th:text="${theme.config.basic.description ?: 'halo-user'}">
            halo-user
          </p>
          <a class="profile-button" th:href="@{/console}" target="_blank" rel="noreferrer"
            >Edit profile</a
          >
          <ul class="profile-meta">
            <li th:if="${theme.config.basic.company}">
              <iconify-icon class="meta-icon" icon="octicon:organization-16"></iconify-icon>
              <span th:text="${theme.config.basic.company}">Company</span>
            </li>
            <li th:if="${theme.config.basic.location}">
              <iconify-icon class="meta-icon" icon="octicon:location-16"></iconify-icon>
              <span th:text="${theme.config.basic.location}">Location</span>
            </li>
            <li th:if="${theme.config.basic.email}">
              <iconify-icon class="meta-icon" icon="octicon:mail-16"></iconify-icon>
              <a
                th:href="|mailto:${theme.config.basic.email}|"
                th:text="${theme.config.basic.email}"
              ></a>
            </li>
          </ul>
        </div>
      </aside>
      <div class="content-column">
        <slot />
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p th:text="${theme.config.basic.title ?: site.title}"></p>
        <halo:footer />
      </div>
    </footer>
  </body>
</html>
