<li class="repo-card" th:each="post : ${posts.items}">
  <div class="repo-card-header">
    <h3 class="repo-name">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8A1.5 1.5 0 0 1 14 1.5v12.75a.75.75 0 0 1-1.2.6L10.83 13H4.5A2.5 2.5 0 0 1 2 10.5Zm2.5-1A1 1 0 0 0 3.5 2.5v8A1 1 0 0 0 4.5 11h6.63a.75.75 0 0 1 .45.15l.92.69V1.5Z"
        />
      </svg>
      <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}"></a>
    </h3>
    <span class="repo-visibility">Public</span>
  </div>
  <p class="repo-desc" th:text="${post.status.excerpt ?: 'No description provided.'}">
    No description provided.
  </p>
  <div class="repo-meta">
    <span class="language-dot"></span>
    <span th:if="${not #lists.isEmpty(post.categories)}">
      <a
        th:each="cat, stat : ${post.categories}"
        th:if="${stat.first}"
        th:href="@{${cat.status.permalink}}"
        th:text="${cat.spec.displayName}"
      ></a>
    </span>
    <span th:unless="${not #lists.isEmpty(post.categories)}">Markdown</span>
    <time th:text="|Updated ${#temporals.format(post.spec.publishTime, 'MMM d')}|"
      >Updated now</time
    >
  </div>
</li>
